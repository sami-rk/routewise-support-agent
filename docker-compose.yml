# API and console together, as the spec lists them.
#
#   docker compose up --build
#   API      http://localhost:8000/docs
#   Console  http://localhost:8501
#
# The database and the Laya/embedding caches live in named volumes, so they
# survive a rebuild. Put your OPENROUTER_API_KEY in a .env next to this file.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # `fake` needs no model download. Use `laya` to route with the local model.
      ROUTER_BACKEND: ${ROUTER_BACKEND:-fake}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODELS: ${LLM_MODELS:-openrouter/free}
      DB_PATH: /data/support.db
      CHECKPOINT_DB_PATH: /data/checkpoints.db
      KB_DIR: /data/knowledge_base
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
    volumes:
      - support-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
    depends_on:
      api:
        condition: service_healthy

volumes:
  support-data:
